<style>
:root{--bg:#F5F6F0;--surface:#fff;--surface2:#ECEFE4;--ink:#1B231C;--muted:#7B857A;--line:#D6DCCF;--accent:#2E6B3B}
@media (prefers-color-scheme:dark){:root{--bg:#131813;--surface:#1B211B;--surface2:#232B23;--ink:#E7ECE2;--muted:#8B958A;--line:#2F382F;--accent:#6FB37E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Segoe UI",Tahoma,sans-serif}
header{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:2px solid var(--accent);padding:.6rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
h1{font-size:1.1rem;margin:0}h1 b{color:var(--accent)}select,input{font:inherit;padding:.2rem .4rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.hint{color:var(--muted);font-size:.85rem;margin-inline-start:auto}
main{padding:1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--fw,200px),1fr));gap:1.1rem;align-items:start}
.shot{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.5rem;display:grid;gap:.4rem;justify-items:center}
.frame{position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--line);background:#fff;width:var(--fw,200px);height:var(--fh,420px)}
.shot[data-has="0"] .frame{background:var(--surface2);border-style:dashed}
iframe{position:absolute;top:0;right:0;border:0;background:#fff;width:var(--dw,390px);height:var(--dh,844px);transform:scale(var(--z,.5));transform-origin:top right}
.open{position:absolute;top:4px;left:4px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 .35rem;text-decoration:none;color:var(--ink);font-size:.8rem}
figcaption{display:grid;justify-items:center;text-align:center;font-size:.85rem}figcaption small{color:var(--muted);font-size:.72rem}
.ph{padding:.5rem;display:grid;gap:.25rem;align-content:start;height:100%;overflow:hidden;font-size:.72rem;color:var(--muted)}
.ph-t{font-weight:600;color:var(--ink);font-size:.85rem;border-bottom:1px solid var(--line);padding-bottom:.2rem;margin-bottom:.2rem}
.ph span{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.1rem .3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-a{display:flex;gap:.2rem;flex-wrap:wrap;margin-top:.3rem}.ph-a b{background:var(--accent);color:#fff;border-radius:4px;padding:.05rem .35rem;font-weight:500}
</style>
